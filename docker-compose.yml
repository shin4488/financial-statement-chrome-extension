version: '3.8'
services:
  appfront:
    build: .
    ports:
      - 5173:5173
    volumes:
      - .:/home/app/financialStatementChromeExtention
      # node_modulesはホストと共有しない（Vite/rolldownがOS別のネイティブバイナリを使うため、
      # コンテナ(Linux)内でinstallした実体を名前付きボリュームに持つ）
      - extension_node_modules:/home/app/financialStatementChromeExtention/node_modules
volumes:
  extension_node_modules:
