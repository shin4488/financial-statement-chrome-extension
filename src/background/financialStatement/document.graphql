query FinancialReports($stockCodes: [String!]) {
  financialReports(limit: 100, offset: 0, stockCodes: $stockCodes) {
    id
    stockCode
    companyName
    fiscalYearStartDate
    fiscalYearEndDate
    accountingStandard
    consolidationType
    financialIndicators {
      roe {
        value
        status
        source
      }
      roa {
        value
        status
      }
      netProfitMargin {
        value
        status
      }
      assetTurnover {
        value
        status
      }
      financialLeverage {
        value
        status
      }
    }
    balanceSheet {
      renderable
      note
      bars {
        label
        segments {
          key
          label
          amount
          signedAmount
          ratio
          colorRole
          tooltipLabel
        }
      }
    }
    profitLoss {
      renderable
      note
      bars {
        label
        segments {
          key
          label
          amount
          signedAmount
          ratio
          colorRole
          tooltipLabel
        }
      }
    }
    cashFlow {
      renderable
      note
      steps {
        key
        label
        amount
        kind
        colorRole
      }
    }
  }
}
