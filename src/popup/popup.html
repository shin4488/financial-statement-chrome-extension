<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Popup</title>
    <style>
      /* ポップアップ窓の希望サイズはhtmlで完全に固定する（幅28rem × 高さ600px=Chromeの上限）。
         Chromeは文書の希望サイズから窓サイズを推定するが、その推定に任せると
         ・スタイル適用前の一瞬やカルーセル内部の帯を実寸とみなして窓幅が上限800pxに張り付く
         ・文書自体が縦スクロールすると窓幅にスクロールバー分が足されて右に隙間ができる
         という2つの事故が起きる。
         ただし画面の空きが足りないとChromeは窓を600pxより低くする。表示（body）の高さは
         希望サイズではなく実際の窓に合わせ、スクロールはその内側に閉じ込める
         （600pxのままだと下端が窓の外に出て末尾が隠れ、文書ごとずれると上部のバーも隠れる）。
         幅は窓に合わせず28remに固定する。Chromeは窓を最小の大きさで開いてから広げるため、
         幅も窓に合わせると、開いた直後の狭い幅で表示全体を組み立ててから組み直すことになり、開くのが遅くなる */
      html {
        width: 28rem;
        height: 600px;
        overflow: hidden;
      }
      body {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        width: 28rem;
        margin: 0;
      }
      #root {
        height: 100%;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script src="./index.tsx" type="module"></script>
  </body>
</html>
