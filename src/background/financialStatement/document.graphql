query FinancialReports($stockCodes: [String!]) {
  financialReports(limit: 100, offset: 0, stockCodes: $stockCodes) {
    id
    stockCode
    companyName
    fiscalYearStartDate
    fiscalYearEndDate
    accountingStandard
    consolidationType
    balanceSheet {
      renderable
      note
      bars {
        label
        segments {
          key
          label
          amount
          signedAmount
          ratio
          colorRole
        }
      }
    }
    profitLoss {
      renderable
      note
      bars {
        label
        segments {
          key
          label
          amount
          signedAmount
          ratio
          colorRole
        }
      }
    }
    cashFlow {
      renderable
      note
      steps {
        key
        label
        amount
        kind
      }
    }
  }
}
